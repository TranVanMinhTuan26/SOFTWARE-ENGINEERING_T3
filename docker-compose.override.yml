services:
  db:
    ports: !override
      - "5437:5432"
  api:
    ports: !override
      - "4000:4000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://brewlite:brewlite_dev_password@db:5432/brewlite?schema=public
      ALLOW_INSECURE_PASSWORD_RESET: "true"
      WEB_ORIGIN: http://localhost:3000
      VNPAY_RETURN_URL: http://localhost:4000/payments/vnpay/return
  web:
    ports: !override
      - "3000:3000"
    build:
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_ENABLE_LOCAL_DEMO_PASSWORD_RESET: "true"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000

