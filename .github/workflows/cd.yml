name: CD
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  quality:
    uses: ./.github/workflows/quality-reusable.yml
  publish:
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    outputs:
      owner: ${{ steps.owner.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: api
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.value }}/brewlite-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: web
          push: true
          build-args: NEXT_PUBLIC_API_URL=${{ vars.API_URL }}
          tags: ghcr.io/${{ steps.owner.outputs.value }}/brewlite-web:${{ github.sha }}
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Transfer configuration and deploy
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SHA: ${{ github.sha }}
        run: |
          scp docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:/opt/brewlite/"
          scp -r deploy "$DEPLOY_USER@$DEPLOY_HOST:/opt/brewlite/"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "bash /opt/brewlite/deploy/deploy.sh '$SHA'"
      - name: Public HTTPS smoke
        id: smoke
        env:
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: node scripts/smoke.cjs
      - name: Roll back if public smoke failed
        if: failure() && steps.deploy.outcome == 'success' && steps.smoke.outcome == 'failure'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" 'bash /opt/brewlite/deploy/rollback.sh'
