$kind: http-request
name: "05 Add cart item"
url: http://localhost:4000/cart/items
method: POST
headers:
  Authorization: "Bearer {{token}}"
  Content-Type: "application/json"
body:
  type: text
  content: |-
    {
      "productId": "{{productId}}",
      "size": "M",
      "toppings": [],
      "qty": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Cart item added", () => pm.response.to.have.status(201));
    language: text/javascript
order: 5000
