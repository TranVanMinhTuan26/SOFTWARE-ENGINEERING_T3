services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
    volumes:
      - brewlite_prod_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    image: ghcr.io/${IMAGE_OWNER:?Set IMAGE_OWNER}/brewlite-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-brewlite}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set a long random JWT_SECRET}
      STAFF_KEY: ${STAFF_KEY:?Set STAFF_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@brewlite.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin123!}
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN to the public frontend origin}
      PORT: 4000
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db: {condition: service_healthy}
    command: sh -c "npx prisma migrate deploy && npm run seed && npm run start:prod"
  web:
    image: ghcr.io/${IMAGE_OWNER:?Set IMAGE_OWNER}/brewlite-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [api]
volumes:
  brewlite_prod_db:
