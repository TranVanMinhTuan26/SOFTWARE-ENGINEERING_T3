name: brewlite-production
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-brewlite}
    volumes: [prod_db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
  api:
    image: ghcr.io/${IMAGE_OWNER:?required}/brewlite-api:${IMAGE_TAG:?required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?required}
      JWT_SECRET: ${JWT_SECRET:?required}
      WEB_ORIGIN: https://${WEB_DOMAIN:?required}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:?required}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:?required}
      VNPAY_RETURN_URL: https://${API_DOMAIN:?required}/payments/vnpay/return
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      start_period: 30s
      retries: 10
  web:
    image: ghcr.io/${IMAGE_OWNER:?required}/brewlite-web:${IMAGE_TAG:?required}
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?required}
      API_DOMAIN: ${API_DOMAIN:?required}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, api]
volumes:
  prod_db:
  caddy_data:
  caddy_config:
