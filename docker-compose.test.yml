services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brewlite_test
      POSTGRES_PASSWORD: test_only_password
      POSTGRES_DB: brewlite_test
    ports: ["127.0.0.1:55432:5432"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U brewlite_test -d brewlite_test"]
      interval: 3s
      retries: 20
